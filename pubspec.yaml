name: evolt
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  
  # Google Sign In
  google_sign_in: ^6.2.0
  
  # UI & State Management
  cupertino_icons: ^1.0.2
  provider: ^6.1.0
  image_picker: ^0.8.7+5

  # Others
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true